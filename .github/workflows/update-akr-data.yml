name: Update AKR data

on:
  workflow_dispatch:

jobs:
  update-akr:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Compile downloader
        run: |
          mkdir -p downloader/out
          javac -d downloader/out downloader/src/AKRCdawebDownloader.java

      - name: Run downloader
        run: |
          java -cp downloader/out AKRCdawebDownloader --once

      - name: Show downloaded files
        run: |
          ls -lh data/
          echo "-----"
          head -c 500 data/akr.json || true

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/

          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Update AKR data"
            git push
          fi
